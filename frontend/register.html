<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Started · Finora Financial Habit Builder</title>
  <meta name="description" content="Start building disciplined financial habits and growing your net worth in under 60 seconds with Finora." />
  <link rel="canonical" href="https://wealthpulse.app/register.html" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:title" content="Get Started · Finora" />
  <meta property="og:description" content="Start tracking expenses and building financial habits free." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wealthpulse.app/register.html" />
  <meta property="og:image" content="https://wealthpulse.app/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand-row">
        <div class="brand-mark">F</div>
        <div>
          <div class="brand-title">Finora</div>
          <div class="brand-subtitle">Habit & Wealth Intelligence</div>
        </div>
      </div>

      <h1>Create your account</h1>
      <p class="subtitle">Start building lasting wealth habits in under 60 seconds.</p>

      <div id="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" required placeholder="e.g. Rahul Sharma" data-testid="register-name" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" data-testid="register-email" />
        </div>
        <div class="form-group">
          <label for="password">Password (min 6 characters)</label>
          <input id="password" type="password" required minlength="6" placeholder="Choose a strong password" autocomplete="new-password" data-testid="register-password" />
        </div>
        <div class="form-group">
          <label for="currency">Primary Currency</label>
          <select id="currency" data-testid="register-currency">
            <option value="INR">INR (₹) - Indian Rupee</option>
            <option value="USD">USD ($) - US Dollar</option>
            <option value="EUR">EUR (€) - Euro</option>
            <option value="GBP">GBP (£) - British Pound</option>
            <option value="AED">AED (د.إ) - UAE Dirham</option>
            <option value="SGD">SGD (S$) - Singapore Dollar</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-testid="register-submit">Create Free Account →</button>
      </form>

      <div class="small-link">
        Already have an account? <a href="/login.html" data-testid="login-link">Log in</a>
      </div>
      <div class="small-link" style="margin-top: 6px;">
        <a href="/" style="color: var(--text-muted);">← Return to homepage</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/cookieConsent.js"></script>
  <script>
    if (Auth.token) window.location.href = '/dashboard.html';

    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        currency: document.getElementById('currency').value,
      };
      try {
        const data = await api('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        Auth.set(data.token, data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error" data-testid="register-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
