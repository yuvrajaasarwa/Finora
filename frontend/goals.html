<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savings Goals · Finora Financial Habit Builder</title>
  <meta name="description" content="Set target sinking funds, track savings goal progress, and achieve financial milestones on Finora." />
  <link rel="canonical" href="https://wealthpulse.app/goals.html" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:title" content="Savings Goals · Finora" />
  <meta property="og:description" content="Sinking fund tracking and milestone goal progress." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wealthpulse.app/goals.html" />
  <meta property="og:image" content="https://wealthpulse.app/favicon.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Savings Goals · Finora" />
  <meta name="twitter:description" content="Sinking funds and milestone target tracking." />
  <meta name="twitter:image" content="https://wealthpulse.app/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <!-- jsPDF & autoTable for Report PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="page-header">
        <div>
          <div class="flex gap-8" style="align-items: center; margin-bottom: 4px;">
            <span class="badge green">🎯 Milestone Targets</span>
          </div>
          <h1>Savings Goals & Sinking Funds</h1>
          <p>Give every rupee an explicit purpose. Set milestone goals and contribute regularly.</p>
        </div>
      </div>

      <!-- Quick Goal Presets -->
      <div class="card mb-16" style="background: var(--bg-1);">
        <div class="flex between mb-12">
          <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Quick Goal Templates:</span>
        </div>
        <div class="pill-buttons">
          <button class="btn btn-ghost btn-sm" onclick="setGoalTemplate('🛡️ Emergency Fund (6 Months)', 150000)">🛡️ Emergency Fund (₹1,50,000)</button>
          <button class="btn btn-ghost btn-sm" onclick="setGoalTemplate('✈️ Annual Vacation & Travel', 60000)">✈️ Vacation Fund (₹60,000)</button>
          <button class="btn btn-ghost btn-sm" onclick="setGoalTemplate('💻 Workstation & Tech Upgrades', 90000)">💻 Tech Upgrades (₹90,000)</button>
          <button class="btn btn-ghost btn-sm" onclick="setGoalTemplate('🚗 Vehicle Down Payment', 200000)">🚗 Vehicle Down Payment (₹2,00,000)</button>
        </div>
      </div>

      <!-- Create Goal Card -->
      <div class="card mb-16">
        <div class="flex between mb-16">
          <h2>Create a New Savings Goal</h2>
          <span class="badge blue">Target Sinking Fund</span>
        </div>
        <form id="goal-form">
          <div class="form-row">
            <div class="form-group">
              <label for="g-title">Goal Name</label>
              <input id="g-title" required placeholder="e.g. Emergency Fund" data-testid="goal-title" />
            </div>
            <div class="form-group">
              <label for="g-target">Target Amount</label>
              <input id="g-target" type="number" min="1" step="0.01" required placeholder="100000" data-testid="goal-target" />
            </div>
            <div class="form-group">
              <label for="g-saved">Initial Seed / Current Savings</label>
              <input id="g-saved" type="number" min="0" step="0.01" placeholder="0.00" data-testid="goal-saved" />
            </div>
            <div class="form-group">
              <label for="g-deadline">Target Deadline (Optional)</label>
              <input id="g-deadline" type="date" data-testid="goal-deadline" />
            </div>
          </div>
          <button class="btn btn-primary" type="submit" data-testid="goal-submit">🎯 Save New Milestone Goal</button>
        </form>
      </div>

      <!-- Goals List -->
      <div id="goals-list" class="grid cols-2">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pdfReport.js"></script>
  <script src="/js/cookieConsent.js"></script>
  <script>
    Auth.requireLogin();
    renderSidebar('goals');

    function setGoalTemplate(title, target) {
      document.getElementById('g-title').value = title;
      document.getElementById('g-target').value = target;
      document.getElementById('g-saved').value = '';
      document.getElementById('g-title').focus();
    }

    async function loadGoals() {
      const goals = await api('/api/goals');
      const el = document.getElementById('goals-list');
      if (!goals.length) {
        el.innerHTML = `<div class="empty" style="grid-column: 1/-1;">No savings goals created yet. Set your first milestone target above ↑</div>`;
        return;
      }
      el.innerHTML = goals.map(g => {
        const isComplete = g.progress_percent >= 100;
        return `
          <div class="card" data-testid="goal-card-${g.id}">
            <div class="flex between mb-12">
              <div>
                <h3 style="margin:0; font-size:16px;">${g.title}</h3>
                <div class="text-muted" style="font-size:12.5px; margin-top:4px;">
                  <strong style="color:var(--text);">${fmtMoney(g.saved_amount)}</strong> saved of ${fmtMoney(g.target_amount)}
                  ${g.deadline ? ` · <span class="badge">${fmtDate(g.deadline)}</span>` : ''}
                </div>
              </div>
              <span class="badge ${isComplete ? 'green' : 'blue'}">${g.progress_percent}%</span>
            </div>
            
            <div class="progress mb-16">
              <div style="width: ${Math.min(g.progress_percent, 100)}%; background: ${isComplete ? 'var(--success)' : 'var(--accent)'};"></div>
            </div>

            <div class="flex gap-8" style="align-items:center;">
              <input type="number" min="1" step="0.01" placeholder="+ Add contribution amount" id="contrib-${g.id}" data-testid="contrib-input-${g.id}" style="flex:1;" />
              <button class="btn btn-primary btn-sm" data-testid="contrib-btn-${g.id}" onclick="contribute(${g.id})">+ Contribute</button>
              <button class="btn btn-danger btn-sm" data-testid="delete-goal-${g.id}" onclick="deleteGoal(${g.id})">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function contribute(id) {
      const input = document.getElementById(`contrib-${id}`);
      const val = input.value;
      if (!val || Number(val) <= 0) return alert('Please enter a valid contribution amount.');
      try {
        await api(`/api/goals/${id}/contribute`, {
          method: 'PATCH',
          body: JSON.stringify({ amount: Number(val) }),
        });
        input.value = '';
        loadGoals();
      } catch (err) { alert(err.message); }
    }

    async function deleteGoal(id) {
      if (!confirm('Are you sure you want to delete this savings goal?')) return;
      await api(`/api/goals/${id}`, { method: 'DELETE' });
      loadGoals();
    }

    document.getElementById('goal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/goals', {
          method: 'POST',
          body: JSON.stringify({
            title: document.getElementById('g-title').value.trim(),
            target_amount: document.getElementById('g-target').value,
            saved_amount: document.getElementById('g-saved').value || 0,
            deadline: document.getElementById('g-deadline').value || null,
          }),
        });
        e.target.reset();
        loadGoals();
      } catch (err) { alert(err.message); }
    });

    loadGoals();
  </script>
</body>
</html>
